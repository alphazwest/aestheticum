[project]
name = "aestheticum"
version = "0.1.0"
description = "A canonical, sourced reference of visual aesthetics and the domains in which they appear."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23"]

[dependency-groups]
dev = ["pre-commit>=4", "pytest>=8", "ruff>=0.17"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config"]
