name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint and format
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Test
        run: uv run pytest
